global:
  scrape_interval: 5s
  evaluation_interval: 5s

  # Enable tracing
  external_labels:
    cluster: 'e2e-test'

# Tracing configuration - send traces to OTLP endpoint
tracing:
  endpoint: otel-collector:4317
  insecure: true
  sampling_fraction: 1.0  # Sample 100% for demo

# Scrape Prometheus itself
scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Generate some query traffic to create traces
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8888']  # OTEL collector metrics
