receivers:
  # Receive OTLP traces from Prometheus
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # Expose metrics about the collector itself
  prometheus:
    config:
      scrape_configs:
        - job_name: 'otel-collector'
          scrape_interval: 10s
          static_configs:
            - targets: ['localhost:8888']

processors:
  # Add batch processing to improve performance
  batch:
    timeout: 1s
    send_batch_size: 100

  # Add resource attributes
  resource:
    attributes:
      - key: deployment.environment
        value: e2e-test
        action: upsert

exporters:
  # Export traces to Artemis OTLP endpoint
  otlp/artemis:
    endpoint: artemis:4317
    tls:
      insecure: true
    compression: gzip

  # Debug logging (useful for troubleshooting)
  logging:
    loglevel: info
    sampling_initial: 5
    sampling_thereafter: 100

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [otlp/artemis, logging]

  # Enable telemetry
  telemetry:
    logs:
      level: info
    metrics:
      address: :8888
