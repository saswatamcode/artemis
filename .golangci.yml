version: "2"
run:
  timeout: 10m
linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - dogsled
    - dupl
    - errcheck
    - exhaustive
    - gocyclo
    - goprintffuncname
    - govet
    - ineffassign
    - iotamixing
    - misspell
    - modernize
    - nakedret
    - nolintlint
    - staticcheck
    - unconvert
    - unused
    - whitespace
    - nilerr
    - goconst
    - prealloc
    - promlinter
    - unparam
  exclusions:
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/saswatamcode/artemis
